<!doctype html>
<meta charset="utf-8">
<script type="module">
  import "../ha-home-camera-card.js";
  const editor = document.createElement("ha-home-camera-card-editor");
  editor.setConfig({
    cameras: [{ key: "camera_1", name: "Kamera 1", entity: "camera.example_1" }],
    groups: [{ name: "Kamerafelt 1", selector_entity: "sensor.active_camera", camera_keys: ["camera_1"], fallback_camera: "camera_1" }],
  });
  document.body.append(editor);
  const connection = { sendMessagePromise: async () => [
    { entity_id: "camera.example_1", device_id: "device-1" },
    { entity_id: "binary_sensor.example_1_person_detected", device_id: "device-1", original_name: "Person detected", disabled_by: null },
    { entity_id: "binary_sensor.example_1_vehicle_detected", device_id: "device-1", original_name: "Vehicle detected", disabled_by: null },
  ] };
  editor.hass = {
    states: {
      "binary_sensor.example_1_person_detected": { state: "off" },
      "binary_sensor.example_1_vehicle_detected": { state: "off" },
    },
    connection,
  };
  setTimeout(() => {
    const root = editor.shadowRoot;
    const catalog = root.querySelector(".catalog");
    editor.hass = { states: {}, connection };
    document.title = JSON.stringify({
      catalogCameras: root.querySelectorAll("[data-remove-catalog-camera]").length,
      views: root.querySelectorAll("[data-remove-group]").length,
      discoveredDetections: root.querySelectorAll("[data-detection-toggle]").length,
      allowedChoices: root.querySelectorAll("[data-camera-allow]").length,
      fallbackChoices: root.querySelectorAll("[data-group-select='fallback_camera'] option").length,
      stableAfterHassUpdate: root.querySelector(".catalog") === catalog,
    });
  }, 50);
</script>
